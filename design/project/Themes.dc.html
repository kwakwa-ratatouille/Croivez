<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
body{margin:0}
a{color:inherit}a:hover{color:inherit}
.cz{--bg:#FBF8F3;--surface:#FFFFFF;--surface2:#F4EFE6;--line:#E9E2D6;--text:#2F3437;--muted:#5D646A;--primary:#2F3437;--on-primary:#FBF8F3;--shadow:0 8px 28px rgba(80,62,35,.07);--lx:#DE8B6A;--lv:#6FC59F;--geo:#6BB8C4;--geo-t:#E3F3F4;--geo-i:#1F6670;--cine:#F2A68A;--cine-t:#FCEAE2;--cine-i:#8E4128;--mus:#B3A3DB;--mus-t:#EEEAF8;--mus-i:#5A4A8C;--nat:#9DBB97;--nat-t:#E8F0E5;--nat-i:#3F6339;--sci:#E8AFC0;--sci-t:#FAE8EE;--sci-i:#8A3E56;--his:#DDB65E;--his-t:#F8EFD8;--his-i:#765610;--brd:#8FA0CF;--brd-t:#E7EBF6;--brd-i:#3E4F86;--ok:#8FD3B6;--ok-t:#E2F5EC;--ok-i:#22664A;--ko:#E0997A;--ko-t:#FBE9E1;--ko-i:#97482A;font-family:'DM Sans',system-ui,sans-serif;color:var(--text);background:var(--bg)}
.cz.dark{--bg:#131B2E;--surface:#1A2440;--surface2:#24304F;--line:#2F3B5E;--text:#EEE9E0;--muted:#AEB6C8;--primary:#EEE9E0;--on-primary:#131B2E;--shadow:0 10px 30px rgba(0,0,0,.3);--lx:#EDA98A;--lv:#93D9BB;--geo:#7CCFDA;--geo-t:#1B3946;--geo-i:#A6E3EA;--cine:#F4B097;--cine-t:#3D2A2C;--cine-i:#F8C4B0;--mus:#BDAEE6;--mus-t:#2C2A4C;--mus-i:#D3C8F4;--nat:#A9C8A2;--nat-t:#223A30;--nat-i:#C1DDBA;--sci:#EDB9C9;--sci-t:#3C2839;--sci-i:#F5CAD8;--his:#E5C26E;--his-t:#38321F;--his-i:#EED493;--brd:#9DADDA;--brd-t:#232F50;--brd-i:#BFCBEF;--ok:#93D9BB;--ok-t:#1D3B35;--ok-i:#A8E6CB;--ko:#E9A585;--ko-t:#3E2C29;--ko-i:#F3BCA2}
.cz *{box-sizing:border-box}
.cz h1,.cz h2,.cz h3,.cz h4,.cz p{margin:0}
.t{font-family:Nunito,system-ui,sans-serif}
.ic{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.card{background:var(--surface);border:1px solid var(--line);border-radius:24px;box-shadow:var(--shadow)}
.kbd{display:inline-flex;align-items:center;justify-content:center;min-width:26px;height:26px;padding:0 7px;border-radius:8px;border:1.5px solid var(--line);background:var(--surface2);font:600 13px 'DM Sans',sans-serif;color:var(--muted)}
.chip{display:inline-flex;align-items:center;gap:6px;min-height:30px;padding:0 12px;border-radius:999px;font:600 13px 'DM Sans',sans-serif}
.nav{display:flex;align-items:center;gap:12px;min-height:46px;padding:0 14px;border-radius:14px;text-decoration:none;color:var(--muted);font-weight:500;font-size:15px;transition:background-color .2s ease-out}
.nav:hover{background:var(--surface2);color:var(--text)}
.nav.on{background:var(--surface2);color:var(--text);font-weight:700}
.bar{height:8px;border-radius:999px;background:var(--surface2);overflow:hidden}
.bar>span{display:block;height:100%;border-radius:999px}
.lx{fill:none;stroke:var(--lx);stroke-linecap:round}
.lv{fill:none;stroke:var(--lv);stroke-linecap:round;stroke-linejoin:round}
.sub{display:inline-flex;align-items:center;min-height:44px;padding:0 16px;border-radius:14px;background:var(--surface);font:600 14px 'DM Sans',sans-serif;text-decoration:none;transition:transform .2s ease-out}
.sub:hover{transform:translateY(-1px)}
@media (prefers-reduced-motion:reduce){.cz *{animation:none!important;transition:none!important}}
</style>
</helmet>
<div class="cz {{mode}}" style="min-height: 900px; display: flex; flex-wrap: wrap">

</nav>

<main style="flex: 999 1 560px; min-width: 0; padding: 48px 56px; display: flex; flex-direction: column; gap: 28px">
<header style="display: flex; align-items: center; justify-content: space-between; gap: 24px; flex-wrap: wrap">
<div style="display: flex; flex-direction: column; gap: 6px"><h1 class="t" style="font-size: 36px; font-weight: 900">Thèmes</h1><p style="font-size: 17px; color: var(--muted)">Sept familles, une couleur chacune. Choisissez un sous-thème pour lancer une partie.</p></div>
<div style="flex: 0 1 420px; display: flex; align-items: center; gap: 12px; min-height: 56px; padding: 0 18px; border-radius: 18px; background: var(--surface); border: 1.5px solid var(--line)">
<svg class="ic" viewBox="0 0 24 24" aria-hidden="true" style="color: var(--muted)"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg>
<label for="th-search" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Rechercher un thème</label>
<input id="th-search" placeholder="Rechercher : capitales, insectes, logos…" style="flex: 1; min-width: 0; border: 0; outline: 0; background: transparent; font: 500 16px 'DM Sans', sans-serif; color: var(--text)">
<span class="kbd">Ctrl K</span>
</div>
</header>

<section style="display: grid; grid-template-columns: repeat(auto-fill, minmax(330px, 1fr)); gap: 20px">
<sc-for list="{{families}}" as="f" hint-placeholder-count="7">
<article style="border-radius: 24px; padding: 24px; background: var(--{{f.k}}-t); color: var(--{{f.k}}-i); display: flex; flex-direction: column; gap: 16px; position: relative; overflow: hidden">
<svg viewBox="0 0 120 80" width="150" aria-hidden="true" style="position: absolute; right: -16px; top: -8px; opacity: .55"><path d="{{f.motif}}" style="fill: none; stroke: var(--{{f.k}}); stroke-width: 2; stroke-linecap: round; stroke-linejoin: round"></path></svg>
<div style="display: flex; align-items: center; gap: 14px; position: relative">
<div style="width: 52px; height: 52px; border-radius: 16px; background: var(--surface); display: flex; align-items: center; justify-content: center"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true" style="width: 28px; height: 28px"><path d="{{f.icon}}"></path></svg></div>
<div style="display: flex; flex-direction: column; gap: 2px"><h2 class="t" style="font-size: 21px; font-weight: 800">{{f.name}}</h2><span style="font-size: 13px; font-weight: 600">{{f.pct}} % maîtrisé · {{f.count}} sous-thèmes</span></div>
</div>
<div class="bar" style="background: var(--surface); position: relative"><span style="width: {{f.pct}}%; background: var(--{{f.k}})"></span></div>
<div style="display: flex; flex-wrap: wrap; gap: 8px; position: relative">
<sc-for list="{{f.subs}}" as="s" hint-placeholder-count="4"><a class="sub" href="Configuration.dc.html">{{s}}</a></sc-for>
</div>
</article>
</sc-for>
</section>
</main>
</div>
</x-dc>
