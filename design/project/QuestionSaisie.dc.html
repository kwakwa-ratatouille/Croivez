<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Croivez — Question saisie libre</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&amp;family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:inherit}a:hover{color:inherit}
.cz{--bg:#FBF8F3;--surface:#FFFFFF;--surface2:#F4EFE6;--line:#E9E2D6;--text:#2F3437;--muted:#5D646A;--primary:#2F3437;--on-primary:#FBF8F3;--shadow:0 8px 28px rgba(80,62,35,.07);--geo:#6BB8C4;--geo-t:#E3F3F4;--geo-i:#1F6670;--ok:#8FD3B6;--ok-t:#E2F5EC;--ok-i:#22664A;font-family:'DM Sans',system-ui,sans-serif;color:var(--text);background:var(--bg)}
.cz.dark{--bg:#131B2E;--surface:#1A2440;--surface2:#24304F;--line:#2F3B5E;--text:#EEE9E0;--muted:#AEB6C8;--primary:#EEE9E0;--on-primary:#131B2E;--shadow:0 10px 30px rgba(0,0,0,.3);--geo:#7CCFDA;--geo-t:#1B3946;--geo-i:#A6E3EA;--ok:#93D9BB;--ok-t:#1D3B35;--ok-i:#A8E6CB}
.cz *{box-sizing:border-box}
.cz h1,.cz h2,.cz p{margin:0}
.t{font-family:Nunito,system-ui,sans-serif}
.ic{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:52px;padding:0 24px;border-radius:16px;border:0;font:600 16px 'DM Sans',sans-serif;text-decoration:none;cursor:pointer;transition:transform .2s ease-out}
.btn:hover{transform:translateY(-1px)}
.btn-p{background:var(--primary);color:var(--on-primary)}
.kbd{display:inline-flex;align-items:center;justify-content:center;min-width:26px;height:26px;padding:0 7px;border-radius:8px;border:1.5px solid var(--line);background:var(--surface2);font:600 13px 'DM Sans',sans-serif;color:var(--muted)}
.chip{display:inline-flex;align-items:center;gap:6px;min-height:30px;padding:0 12px;border-radius:999px;font:600 13px 'DM Sans',sans-serif}
.bar{height:10px;border-radius:999px;background:var(--surface2);overflow:hidden}
.bar>span{display:block;height:100%;border-radius:999px}
@media (prefers-reduced-motion:reduce){.cz *{animation:none!important;transition:none!important}}
</style>
</helmet>
<div class="cz {{mode}}" style="min-height: 900px; display: flex; flex-direction: column">

<header style="display: flex; align-items: center; gap: 24px; flex-wrap: wrap; padding: 20px 40px; border-bottom: 1px solid var(--line); background: var(--surface)">
<a href="Accueil.dc.html" style="display: inline-flex; align-items: center; gap: 8px; min-height: 44px; padding: 0 14px; border-radius: 14px; text-decoration: none; font-weight: 600; color: var(--muted)"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"></path></svg>Quitter<span class="kbd">Échap</span></a>
<div style="flex: 1 1 300px; display: flex; align-items: center; gap: 14px">
<div class="bar" style="flex: 1"><span style="width: 50%; background: var(--geo)"></span></div>
<span style="font-size: 14px; font-weight: 600; color: var(--muted); white-space: nowrap">5 / 10</span>
</div>
<span class="chip" style="background: var(--geo-t); color: var(--geo-i)">Géographie · Drapeaux · Saisie libre</span>
</header>

<main style="flex: 1; width: 100%; max-width: 860px; margin: 0 auto; padding: 48px 40px; display: flex; flex-direction: column; align-items: center; gap: 32px">
<h1 class="t" style="font-size: 40px; font-weight: 900; text-align: center">À quel pays appartient ce drapeau ?</h1>

<div style="padding: 20px; border-radius: 28px; background: var(--surface); border: 1px solid var(--line); box-shadow: var(--shadow)">
<svg viewBox="0 0 3 2" width="420" role="img" aria-label="Drapeau à identifier : bande jaune sur la moitié supérieure, puis une bande bleue et une bande rouge" style="display: block; border-radius: 14px; box-shadow: 0 0 0 1px rgba(0,0,0,.06)"><rect x="0" y="0" width="3" height="1" style="fill: #FCD116"></rect><rect x="0" y="1" width="3" height="0.5" style="fill: #003893"></rect><rect x="0" y="1.5" width="3" height="0.5" style="fill: #CE1126"></rect></svg>
</div>

<div style="width: 100%; display: flex; flex-direction: column; gap: 10px">
<label for="rep" style="font-weight: 600; font-size: 15px">Votre réponse</label>
<div style="display: flex; gap: 12px">
<div style="flex: 1; position: relative">
<div style="display: flex; align-items: center; gap: 12px; min-height: 64px; padding: 0 20px; border-radius: 20px; border: 2px solid var(--geo); background: var(--surface); box-shadow: 0 0 0 5px var(--geo-t)">
<input id="rep" value="Colonbie" autocomplete="off" aria-describedby="rep-aide" style="flex: 1; min-width: 0; border: 0; outline: 0; background: transparent; font: 600 22px 'DM Sans', sans-serif; color: var(--text)">
</div>
<div role="listbox" aria-label="Suggestions" style="position: absolute; left: 0; right: 0; top: 74px; padding: 8px; border-radius: 20px; background: var(--surface); border: 1px solid var(--line); box-shadow: var(--shadow)">
<div role="option" aria-selected="true" style="display: flex; align-items: center; gap: 14px; min-height: 52px; padding: 0 14px; border-radius: 14px; background: var(--geo-t); color: var(--geo-i)"><span style="font-weight: 700; font-size: 18px">Colombie</span><span style="font-size: 14px">Vouliez-vous dire ?</span><span class="kbd" style="margin-left: auto">Tab</span></div>
</div>
</div>
<a class="btn btn-p" href="QuestionCarte.dc.html" style="min-height: 64px; padding: 0 28px; font-size: 17px">Valider<span class="kbd" style="background: transparent; color: var(--on-primary); border-color: var(--on-primary); opacity: .7">Entrée</span></a>
</div>
<p id="rep-aide" style="margin-top: 76px; font-size: 15px; color: var(--muted); display: flex; align-items: center; gap: 8px"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true" style="width: 18px; height: 18px"><path d="M9.5 18h5M10.5 21h3M12 3a6 6 0 0 0-3.4 10.9c.6.5.9 1.2.9 2.1h5c0-.9.3-1.6.9-2.1A6 6 0 0 0 12 3Z"></path></svg>Les accents et les petites fautes de frappe sont acceptés.</p>
</div>
</main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":false},"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    return { mode: this.props.dark ? 'dark' : '' };
  }
}
</script>
</body>
</html>
