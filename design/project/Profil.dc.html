<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Croivez — Profil et progression</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&amp;family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:inherit}a:hover{color:inherit}
.cz{--bg:#FBF8F3;--surface:#FFFFFF;--surface2:#F4EFE6;--line:#E9E2D6;--text:#2F3437;--muted:#5D646A;--primary:#2F3437;--on-primary:#FBF8F3;--shadow:0 8px 28px rgba(80,62,35,.07);--lx:#DE8B6A;--lv:#6FC59F;--geo:#6BB8C4;--geo-t:#E3F3F4;--geo-i:#1F6670;--cine:#F2A68A;--cine-t:#FCEAE2;--cine-i:#8E4128;--mus:#B3A3DB;--mus-t:#EEEAF8;--mus-i:#5A4A8C;--nat:#9DBB97;--nat-t:#E8F0E5;--nat-i:#3F6339;--sci:#E8AFC0;--sci-t:#FAE8EE;--sci-i:#8A3E56;--his:#DDB65E;--his-t:#F8EFD8;--his-i:#765610;--brd:#8FA0CF;--brd-t:#E7EBF6;--brd-i:#3E4F86;--ok:#8FD3B6;--ok-t:#E2F5EC;--ok-i:#22664A;font-family:'DM Sans',system-ui,sans-serif;color:var(--text);background:var(--bg)}
.cz.dark{--bg:#131B2E;--surface:#1A2440;--surface2:#24304F;--line:#2F3B5E;--text:#EEE9E0;--muted:#AEB6C8;--primary:#EEE9E0;--on-primary:#131B2E;--shadow:0 10px 30px rgba(0,0,0,.3);--lx:#EDA98A;--lv:#93D9BB;--geo:#7CCFDA;--geo-t:#1B3946;--geo-i:#A6E3EA;--cine:#F4B097;--cine-t:#3D2A2C;--cine-i:#F8C4B0;--mus:#BDAEE6;--mus-t:#2C2A4C;--mus-i:#D3C8F4;--nat:#A9C8A2;--nat-t:#223A30;--nat-i:#C1DDBA;--sci:#EDB9C9;--sci-t:#3C2839;--sci-i:#F5CAD8;--his:#E5C26E;--his-t:#38321F;--his-i:#EED493;--brd:#9DADDA;--brd-t:#232F50;--brd-i:#BFCBEF;--ok:#93D9BB;--ok-t:#1D3B35;--ok-i:#A8E6CB}
.cz *{box-sizing:border-box}
.cz h1,.cz h2,.cz h3,.cz p{margin:0}
.t{font-family:Nunito,system-ui,sans-serif}
.ic{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.card{background:var(--surface);border:1px solid var(--line);border-radius:24px;box-shadow:var(--shadow)}
.chip{display:inline-flex;align-items:center;gap:6px;min-height:30px;padding:0 12px;border-radius:999px;font:600 13px 'DM Sans',sans-serif}
.nav{display:flex;align-items:center;gap:12px;min-height:46px;padding:0 14px;border-radius:14px;text-decoration:none;color:var(--muted);font-weight:500;font-size:15px;transition:background-color .2s ease-out}
.nav:hover{background:var(--surface2);color:var(--text)}
.nav.on{background:var(--surface2);color:var(--text);font-weight:700}
.lx{fill:none;stroke:var(--lx);stroke-linecap:round}
.lv{fill:none;stroke:var(--lv);stroke-linecap:round;stroke-linejoin:round}
@media (prefers-reduced-motion:reduce){.cz *{animation:none!important;transition:none!important}}
</style>
</helmet>
<div class="cz {{mode}}" style="min-height: 900px; display: flex; flex-wrap: wrap">

<nav aria-label="Navigation principale" style="flex: 1 1 248px; display: flex; flex-direction: column; gap: 4px; padding: 28px 18px; background: var(--surface); border-right: 1px solid var(--line)">
<a href="Accueil.dc.html" aria-label="Croivez, accueil" style="display: flex; align-items: center; gap: 10px; padding: 4px 12px 28px; text-decoration: none"><svg viewBox="0 0 116 72" width="42" aria-hidden="true"><path class="lx" d="M16 16 Q33 36 50 58 M50 16 Q32 37 16 58" style="stroke-width: 14"></path><path class="lv" d="M44 40 Q52 49 60 58 Q77 32 102 12" style="stroke-width: 14"></path></svg><span class="t" style="font-size: 24px; font-weight: 900">Croivez</span></a>
<a class="nav" href="Accueil.dc.html"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M3.5 10.5 12 3.5l8.5 7M5.5 9.5V20h13V9.5"></path></svg>Accueil</a>
<a class="nav" href="Themes.dc.html"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="3.5" width="7" height="7" rx="2"></rect><rect x="13.5" y="3.5" width="7" height="7" rx="2"></rect><rect x="3.5" y="13.5" width="7" height="7" rx="2"></rect><rect x="13.5" y="13.5" width="7" height="7" rx="2"></rect></svg>Thèmes</a>
<a class="nav" href="Revision.dc.html"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 12a8 8 0 1 1-2.3-5.7M20 4v5h-5"></path></svg>Révision<span class="chip" style="margin-left: auto; min-height: 24px; padding: 0 9px; background: var(--his-t); color: var(--his-i)">12</span></a>
<a class="nav" href="DuelInvitation.dc.html"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 8h12.5l-3.5-3.5M20 16H7.5l3.5 3.5"></path></svg>Duels</a>
<a class="nav" href="Classements.dc.html"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M3.5 20.5h17"></path><rect x="9" y="5" width="6" height="15.5" rx="1.5"></rect><rect x="3.5" y="10.5" width="5.5" height="10" rx="1.5"></rect><rect x="15" y="13.5" width="5.5" height="7" rx="1.5"></rect></svg>Classements</a>
<a class="nav on" href="Profil.dc.html" aria-current="page"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="4"></circle><path d="M4.5 20.5c1.4-3.8 4.2-5.7 7.5-5.7s6.1 1.9 7.5 5.7"></path></svg>Profil</a>
</nav>

<main style="flex: 999 1 560px; min-width: 0; padding: 40px 56px; display: flex; flex-direction: column; gap: 24px">
<header class="card" style="padding: 28px 32px; display: flex; align-items: center; gap: 28px; flex-wrap: wrap">
<span class="t" style="width: 88px; height: 88px; border-radius: 50%; background: var(--sci-t); color: var(--sci-i); display: flex; align-items: center; justify-content: center; font-size: 36px; font-weight: 900; flex: none">C</span>
<div style="flex: 1 1 320px; display: flex; flex-direction: column; gap: 10px">
<div style="display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap"><h1 class="t" style="font-size: 32px; font-weight: 900">Camille</h1><span style="color: var(--muted)">Exploratrice depuis mars</span></div>
<div style="display: flex; align-items: center; gap: 14px">
<span class="t" style="font-size: 18px; font-weight: 900; white-space: nowrap">Niveau 7</span>
<div style="flex: 1; height: 14px; border-radius: 999px; background: var(--surface2); overflow: hidden"><span style="display: block; width: 82%; height: 100%; border-radius: 999px; background: var(--his)"></span></div>
<span style="font-size: 14px; color: var(--muted); white-space: nowrap">82 % vers le niveau 8</span>
</div>
</div>
</header>

<div style="display: flex; flex-wrap: wrap; gap: 24px">
<section class="card" style="flex: 999 1 460px; min-width: 0; padding: 28px 32px; display: flex; flex-direction: column; gap: 18px">
<h2 class="t" style="font-size: 22px; font-weight: 800">Maîtrise par thème</h2>
<sc-for list="{{mastery}}" as="m" hint-placeholder-count="7">
<div style="display: grid; grid-template-columns: 210px minmax(0, 1fr) 48px; align-items: center; gap: 16px">
<span style="display: flex; align-items: center; gap: 10px; font-weight: 600; font-size: 15px"><span style="width: 32px; height: 32px; border-radius: 10px; background: var(--{{m.k}}-t); color: var(--{{m.k}}-i); display: flex; align-items: center; justify-content: center"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true" style="width: 18px; height: 18px"><path d="{{m.icon}}"></path></svg></span>{{m.name}}</span>
<div style="height: 18px; border-radius: 999px; background: var(--{{m.k}}-t); overflow: hidden"><span style="display: block; width: {{m.pct}}%; height: 100%; border-radius: 999px; background: var(--{{m.k}})"></span></div>
<span style="font-weight: 700; font-size: 15px; text-align: right">{{m.pct}} %</span>
</div>
</sc-for>
</section>

<section style="flex: 1 1 300px; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; align-content: start">
<sc-for list="{{stats}}" as="s" hint-placeholder-count="4">
<div class="card" style="padding: 22px; display: flex; flex-direction: column; gap: 6px"><p class="t" style="font-size: 32px; font-weight: 900">{{s.v}}</p><p style="font-size: 14px; color: var(--muted)">{{s.l}}</p></div>
</sc-for>
</section>
</div>

<section class="card" style="padding: 28px 32px; display: flex; flex-direction: column; gap: 18px">
<h2 class="t" style="font-size: 22px; font-weight: 800">Badges</h2>
<div style="display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 16px">
<sc-for list="{{badges}}" as="b" hint-placeholder-count="6">
<div style="display: flex; flex-direction: column; align-items: center; gap: 10px; text-align: center; opacity: {{b.op}}">
<span style="width: 72px; height: 72px; border-radius: 50%; background: var(--{{b.k}}-t); border: 3px {{b.border}} var(--{{b.k}}); color: var(--{{b.k}}-i); display: flex; align-items: center; justify-content: center"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true" style="width: 30px; height: 30px; stroke-width: 2"><path d="{{b.icon}}"></path></svg></span>
<span style="font-weight: 700; font-size: 14px">{{b.name}}</span>
<span style="font-size: 13px; color: var(--muted)">{{b.sub}}</span>
</div>
</sc-for>
</div>
</section>
</main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":false},"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    const ic = {
      geo: 'M12 3.5a8.5 8.5 0 1 0 0 17a8.5 8.5 0 1 0 0-17ZM3.5 12h17M12 3.5c2.4 2.6 3.5 5.4 3.5 8.5s-1.1 5.9-3.5 8.5c-2.4-2.6-3.5-5.4-3.5-8.5s1.1-5.9 3.5-8.5Z',
      cine: 'M6 7h12a2.5 2.5 0 0 1 2.5 2.5v8A2.5 2.5 0 0 1 18 20H6a2.5 2.5 0 0 1-2.5-2.5v-8A2.5 2.5 0 0 1 6 7ZM3.5 11h17M8 7l2 4M13 7l2 4',
      mus: 'M9 18V6l10-2v12M9 18a2.5 2.5 0 1 1-5 0a2.5 2.5 0 1 1 5 0ZM19 16a2.5 2.5 0 1 1-5 0a2.5 2.5 0 1 1 5 0Z',
      nat: 'M5 19.5C5 11 10 5 20 4.5c0 9.5-6 15-15 15ZM5 19.5c3-4.5 6.5-7.5 10-9',
      sci: 'M9.5 3.5h5M10.5 3.5v5.5L5.2 18.3a1.5 1.5 0 0 0 1.3 2.2h11a1.5 1.5 0 0 0 1.3-2.2L13.5 9V3.5M7.5 15h9',
      his: 'M3.5 9 12 4.5 20.5 9M6 10v7.5M10 10v7.5M14 10v7.5M18 10v7.5M3.5 20h17',
      brd: 'M3.5 12.6V4.5a1 1 0 0 1 1-1h8.1l8 8-9 9ZM10 8.5a1.5 1.5 0 1 1-3 0a1.5 1.5 0 1 1 3 0Z',
      flame: 'M12 3.5c.8 3.2 5 5.2 5 9.8a5 5 0 0 1-10 0c0-2.4 1.3-3.9 2.4-4.9.1 1.9 1 2.9 2 2.9-.3-2.8-.7-5.2.6-7.8Z',
      check: 'm5 12.5 4.5 4.5L19 7.5',
      duel: 'M4 8h12.5l-3.5-3.5M20 16H7.5l3.5 3.5',
      pin: 'M12 21s-7-6.2-7-11.5a7 7 0 0 1 14 0C19 14.8 12 21 12 21ZM12 7a2.5 2.5 0 1 1 0 5a2.5 2.5 0 1 1 0-5Z'
    };
    const mastery = [
      ['geo', 'Géographie', 62], ['cine', 'Cinéma & séries', 41], ['mus', 'Musique', 28], ['nat', 'Nature', 53],
      ['sci', 'Corps & sciences', 35], ['his', 'Histoire', 47], ['brd', 'Marques & logos', 19]
    ].map(([k, name, pct]) => ({ k, name, pct, icon: ic[k] }));
    const stats = [
      { v: '148', l: 'Parties jouées' }, { v: '78 %', l: 'Bonnes réponses' },
      { v: '21 j', l: 'Meilleure série' }, { v: '9 s', l: 'Temps moyen par question' }
    ];
    const badges = [
      { k: 'cine', name: 'Série de 7 jours', sub: 'Obtenu', icon: ic.flame, got: true },
      { k: 'geo', name: 'Globe-trotteur', sub: '50 drapeaux justes', icon: ic.geo, got: true },
      { k: 'ok', name: 'Sans faute', sub: '10/10 en une partie', icon: ic.check, got: true },
      { k: 'brd', name: 'Premier duel', sub: 'Obtenu', icon: ic.duel, got: true },
      { k: 'nat', name: 'Naturaliste', sub: '2 / 3 sous-thèmes', icon: ic.nat, got: false },
      { k: 'his', name: 'Cartographe', sub: 'Une ville à moins de 10 km', icon: ic.pin, got: false }
    ].map((b) => ({ ...b, op: b.got ? 1 : 0.6, border: b.got ? 'solid' : 'dashed' }));
    return { mode: this.props.dark ? 'dark' : '', mastery, stats, badges };
  }
}
</script>
</body>
</html>
