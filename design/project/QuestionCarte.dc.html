<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Croivez — Question carte</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&amp;family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:inherit}a:hover{color:inherit}
.cz{--bg:#FBF8F3;--surface:#FFFFFF;--surface2:#F4EFE6;--line:#E9E2D6;--text:#2F3437;--muted:#5D646A;--primary:#2F3437;--on-primary:#FBF8F3;--shadow:0 8px 28px rgba(80,62,35,.07);--lx:#DE8B6A;--lv:#6FC59F;--geo:#6BB8C4;--geo-t:#E3F3F4;--geo-i:#1F6670;--ok:#8FD3B6;--ok-t:#E2F5EC;--ok-i:#22664A;--ko:#E0997A;--ko-t:#FBE9E1;--ko-i:#97482A;font-family:'DM Sans',system-ui,sans-serif;color:var(--text);background:var(--bg)}
.cz.dark{--bg:#131B2E;--surface:#1A2440;--surface2:#24304F;--line:#2F3B5E;--text:#EEE9E0;--muted:#AEB6C8;--primary:#EEE9E0;--on-primary:#131B2E;--shadow:0 10px 30px rgba(0,0,0,.3);--lx:#EDA98A;--lv:#93D9BB;--geo:#7CCFDA;--geo-t:#1B3946;--geo-i:#A6E3EA;--ok:#93D9BB;--ok-t:#1D3B35;--ok-i:#A8E6CB;--ko:#E9A585;--ko-t:#3E2C29;--ko-i:#F3BCA2}
.cz *{box-sizing:border-box}
.cz h1,.cz h2,.cz p{margin:0}
.t{font-family:Nunito,system-ui,sans-serif}
.ic{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:52px;padding:0 24px;border-radius:16px;border:0;font:600 16px 'DM Sans',sans-serif;text-decoration:none;cursor:pointer;transition:transform .2s ease-out}
.btn:hover{transform:translateY(-1px)}
.btn-p{background:var(--primary);color:var(--on-primary)}
.kbd{display:inline-flex;align-items:center;justify-content:center;min-width:26px;height:26px;padding:0 7px;border-radius:8px;border:1.5px solid var(--line);background:var(--surface2);font:600 13px 'DM Sans',sans-serif;color:var(--muted)}
.chip{display:inline-flex;align-items:center;gap:6px;min-height:30px;padding:0 12px;border-radius:999px;font:600 13px 'DM Sans',sans-serif}
.bar{height:10px;border-radius:999px;background:var(--surface2);overflow:hidden}
.bar>span{display:block;height:100%;border-radius:999px}
.lv{fill:none;stroke:var(--lv);stroke-linecap:round;stroke-linejoin:round}
@keyframes cz-drop{from{transform:translateY(-14px);opacity:0}to{transform:none;opacity:1}}
.drop{animation:cz-drop .3s ease-out both}
@media (prefers-reduced-motion:reduce){.cz *{animation:none!important;transition:none!important}}
</style>
</helmet>
<div class="cz {{mode}}" style="min-height: 900px; display: flex; flex-direction: column">

<header style="display: flex; align-items: center; gap: 24px; flex-wrap: wrap; padding: 20px 40px; border-bottom: 1px solid var(--line); background: var(--surface)">
<a href="Accueil.dc.html" style="display: inline-flex; align-items: center; gap: 8px; min-height: 44px; padding: 0 14px; border-radius: 14px; text-decoration: none; font-weight: 600; color: var(--muted)"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"></path></svg>Quitter<span class="kbd">Échap</span></a>
<div style="flex: 1 1 300px; display: flex; align-items: center; gap: 14px">
<div class="bar" style="flex: 1"><span style="width: 60%; background: var(--geo)"></span></div>
<span style="font-size: 14px; font-weight: 600; color: var(--muted); white-space: nowrap">6 / 10</span>
</div>
<span class="chip" style="background: var(--geo-t); color: var(--geo-i)">Géographie · Villes de France</span>
</header>

<main style="flex: 1; width: 100%; max-width: 1240px; margin: 0 auto; padding: 32px 40px; display: flex; flex-wrap: wrap; gap: 28px; align-items: stretch">

<div style="flex: 999 1 560px; min-width: 0; display: flex; flex-direction: column; gap: 18px">
<h1 class="t" style="font-size: 40px; font-weight: 900">Placez <span style="color: var(--geo-i)">Lyon</span> sur la carte</h1>
<div style="flex: 1; min-height: 600px; border-radius: 28px; background: var(--surface); border: 1px solid var(--line); box-shadow: var(--shadow); position: relative; overflow: hidden; display: flex; align-items: center; justify-content: center">
<svg viewBox="0 0 560 550" width="100%" height="600" role="img" aria-label="Carte de France épurée : votre épingle est posée à 58 km au sud-ouest de Lyon">
<g style="fill: none; stroke: var(--line); stroke-width: 1">
<path d="M0 90H560M0 190H560M0 290H560M0 390H560M0 490H560M90 0V550M190 0V550M290 0V550M390 0V550M490 0V550"></path>
</g>
<path d="M287 17 L348 69 L410 100 L492 126 L471 199 L446 210 L417 272 L449 288 L435 329 L449 376 L467 397 L435 433 L388 423 L363 418 L312 438 L309 470 L258 464 L190 449 L132 418 L154 355 L154 277 L118 225 L35 184 L28 152 L89 137 L140 147 L147 90 L204 100 L255 64 L255 28 Z" style="fill: var(--geo-t); stroke: var(--geo); stroke-width: 2.5; stroke-linejoin: round"></path>
<path d="M536 438 L541 480 L528 522 L507 496 L510 459 Z" style="fill: var(--geo-t); stroke: var(--geo); stroke-width: 2.5; stroke-linejoin: round"></path>
<path d="M352 314 L371 295" style="stroke: var(--text); stroke-width: 2; stroke-dasharray: 4 5"></path>
<g class="drop" transform="translate(352 314)"><path d="M0 0 C-6 -9 -13 -16 -13 -26 a13 13 0 1 1 26 0 c0 10 -7 17 -13 26Z" style="fill: var(--ko); stroke: var(--surface); stroke-width: 2.5"></path><circle cx="0" cy="-26" r="4.5" style="fill: var(--surface)"></circle></g>
<g transform="translate(371 295)"><circle r="17" style="fill: var(--ok-t); stroke: var(--ok); stroke-width: 2.5"></circle><path class="lv" d="M-7 0 L-2 6 L8 -6" style="stroke: var(--ok-i); stroke-width: 3"></path></g>
<g transform="translate(398 262)"><rect x="0" y="-18" width="74" height="32" rx="12" style="fill: var(--surface); stroke: var(--line)"></rect><text x="37" y="3" text-anchor="middle" style="font: 700 15px 'DM Sans', sans-serif; fill: var(--text)">Lyon</text></g>
</svg>
<div style="position: absolute; left: 20px; bottom: 20px; display: flex; gap: 8px">
<button type="button" aria-label="Zoomer" style="width: 44px; height: 44px; border-radius: 14px; border: 1px solid var(--line); background: var(--surface); color: var(--text); font: 600 20px 'DM Sans', sans-serif; cursor: pointer">+</button>
<button type="button" aria-label="Dézoomer" style="width: 44px; height: 44px; border-radius: 14px; border: 1px solid var(--line); background: var(--surface); color: var(--text); font: 600 20px 'DM Sans', sans-serif; cursor: pointer">−</button>
</div>
</div>
</div>

<aside style="flex: 1 1 320px; display: flex; flex-direction: column; gap: 18px; padding-top: 70px">
<div style="padding: 28px; border-radius: 24px; background: var(--ok-t); color: var(--ok-i); display: flex; flex-direction: column; gap: 10px">
<span style="font-weight: 600; font-size: 15px">Votre épingle est à</span>
<p class="t" style="font-size: 56px; font-weight: 900; line-height: 1">58 km</p>
<span style="font-weight: 600; font-size: 15px">de Lyon, au sud-ouest</span>
</div>
<div style="padding: 24px; border-radius: 24px; background: var(--surface); border: 1px solid var(--line); display: flex; flex-direction: column; gap: 12px">
<div style="display: flex; align-items: center; gap: 14px; font-size: 15px"><span style="width: 18px; height: 18px; border-radius: 50%; background: var(--ko); flex: none"></span>Votre épingle</div>
<div style="display: flex; align-items: center; gap: 14px; font-size: 15px"><span style="width: 18px; height: 18px; border-radius: 50%; background: var(--ok-t); border: 2.5px solid var(--ok); flex: none"></span>Position réelle</div>
</div>
<div style="padding: 24px; border-radius: 24px; background: var(--geo-t); color: var(--geo-i); display: flex; flex-direction: column; gap: 8px">
<p style="font-weight: 700; display: flex; align-items: center; gap: 8px"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true" style="width: 20px; height: 20px"><path d="M9.5 18h5M10.5 21h3M12 3a6 6 0 0 0-3.4 10.9c.6.5.9 1.2.9 2.1h5c0-.9.3-1.6.9-2.1A6 6 0 0 0 12 3Z"></path></svg>Le saviez-vous ?</p>
<p style="font-size: 16px; line-height: 1.55">Lyon s'est construite au confluent de deux cours d'eau : le Rhône et la Saône.</p>
</div>
<a class="btn btn-p" href="QuestionSon.dc.html" style="margin-top: auto">Question suivante<span class="kbd" style="background: transparent; color: var(--on-primary); border-color: var(--on-primary); opacity: .7">Entrée</span></a>
</aside>
</main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":false},"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    return { mode: this.props.dark ? 'dark' : '' };
  }
}
</script>
</body>
</html>
