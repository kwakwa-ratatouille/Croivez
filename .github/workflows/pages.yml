# Version web publique (GitHub Pages) : sert au mode télé, le QR code ouvre
# https://kwakwa-ratatouille.github.io/Croivez/#/rejoindre/CODE sur n'importe quel téléphone.
# Se met à jour à chaque push (Pages doit être activé : Settings → Pages → Source : GitHub Actions).
name: Version web

on:
  push:
    branches: [main]
    paths: ['app/**']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  pages:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploiement.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Build
        working-directory: app
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
        run: |
          npm ci
          VITE_WEB=$(git rev-list --count HEAD) npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: app/dist

      - id: deploiement
        uses: actions/deploy-pages@v4
