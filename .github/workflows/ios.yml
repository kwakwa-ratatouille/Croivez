# Compile l'IPA iOS (non signée : SideStore la signe avec ton identifiant Apple),
# la publie dans les Releases de ce dépôt et met à jour la source SideStore (sidestore/source.json).
# Déclenchement : pousser un tag vX.Y.Z, ou bouton « Run workflow » dans l'onglet Actions.
name: IPA iOS

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ipa:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Version
        id: v
        working-directory: app
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Build web + sync iOS
        working-directory: app
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
          VITE_BUILD: ${{ github.run_number }}
        # Numéro du contenu embarqué : sert de point de départ aux mises à jour à chaud
        run: |
          npm ci
          VITE_WEB=$(git rev-list --count HEAD) npm run build
          npx cap sync ios

      - name: Build Xcode (sans signature)
        working-directory: app
        run: |
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build/dd \
            MARKETING_VERSION=${{ steps.v.outputs.version }} CURRENT_PROJECT_VERSION=${{ github.run_number }} \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build

      - name: Emballer l'IPA
        working-directory: app
        run: |
          mkdir -p Payload
          cp -R build/dd/Build/Products/Release-iphoneos/App.app Payload/
          zip -qry Croivez.ipa Payload

      - name: Publier la release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="ios-${{ steps.v.outputs.version }}-${{ github.run_number }}"
          gh release create "$TAG" app/Croivez.ipa --target main --title "Croivez ${{ steps.v.outputs.version }} (build ${{ github.run_number }})" --notes "Build iOS automatique, à installer avec SideStore."
          echo "TAG=$TAG" >> "$GITHUB_ENV"

      - name: Mettre à jour la source SideStore
        run: |
          node app/scripts/update-source.mjs sidestore/source.json \
            "${{ steps.v.outputs.version }}" "${{ github.run_number }}" \
            "https://github.com/${{ github.repository }}/releases/download/${TAG}/Croivez.ipa" \
            "$(stat -f%z app/Croivez.ipa)"
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add sidestore/source.json
          git commit -m "SideStore : Croivez ${{ steps.v.outputs.version }} (build ${{ github.run_number }})"
          git pull --rebase --autostash origin main
          git push origin main
