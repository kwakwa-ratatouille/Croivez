# Compile l'APK Android signée (toujours la même clé : elle s'installe par-dessus l'ancienne)
# et la publie. Déclenchement : pousser un tag vX.Y.Z, ou bouton « Run workflow » dans l'onglet Actions.
# Le contenu (quiz, interface) se met ensuite à jour à chaud, sans nouvelle APK.
name: APK Android

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Version
        id: v
        working-directory: app
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Build web + sync Android
        working-directory: app
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
        run: |
          npm ci
          VITE_WEB=$(git rev-list --count HEAD) npm run build
          npx cap sync android

      - name: Build APK
        working-directory: app/android
        env:
          VERSION_CODE: ${{ github.run_number }}
          VERSION_NAME: ${{ steps.v.outputs.version }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon
          cp app/build/outputs/apk/release/app-release.apk ../Croivez.apk

      - name: Publier
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="android-${{ steps.v.outputs.version }}-${{ github.run_number }}"
          gh release create "$TAG" app/Croivez.apk --target main --title "Croivez Android ${{ steps.v.outputs.version }} (build ${{ github.run_number }})" --notes "APK Android, s'installe par-dessus la précédente." --latest=false
          # Ménage : on garde les 1 dernières versions android-* (la release fixe « android » n'est pas concernée)
          gh release list --limit 100 --json tagName,createdAt --jq 'sort_by(.createdAt) | reverse | .[].tagName' | grep '^android-' | tail -n +2 | while read t; do gh release delete "$t" --yes --cleanup-tag; done || true
          # Lien fixe toujours vers la dernière APK (pour le QR code et le README)
          gh release view android >/dev/null 2>&1 || gh release create android --target main --title "Croivez Android (dernière version)" --notes "Téléchargez Croivez.apk." --latest=false
          gh release upload android app/Croivez.apk --clobber
          printf '{\n  "version": "%s",\n  "build": %s,\n  "url": "https://github.com/%s/releases/download/%s/Croivez.apk"\n}\n' "${{ steps.v.outputs.version }}" "${{ github.run_number }}" "${{ github.repository }}" "$TAG" > sidestore/android.json
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add sidestore/android.json
          git commit -m "Android : Croivez ${{ steps.v.outputs.version }} (build ${{ github.run_number }})"
          git pull --rebase --autostash origin main
          git push origin main
