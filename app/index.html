<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./logo.svg" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="" />
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&display=swap" rel="stylesheet" />
    <title>Croivez</title>
    <style>
      /* Écran de lancement affiché avant le chargement de l'appli (remplacé dès que React démarre) */
      .lancement { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; background: #FBF8F3; }
      @media (prefers-color-scheme: dark) { .lancement { background: #131B2E; } }
      .lancement .la-x { stroke-dasharray: 102; animation: la-x 2.6s cubic-bezier(.65,0,.35,1) infinite; }
      .lancement .la-v { stroke-dasharray: 178; animation: la-v 2.6s cubic-bezier(.65,0,.35,1) infinite; }
      .lancement .la-corps { transform-origin: 100px 100px; animation: la-rebond 2.6s ease-out infinite; }
      .lancement .la-onde { transform-origin: 100px 100px; opacity: 0; animation: la-onde 2.6s ease-out infinite; }
      @keyframes la-x { 0% { stroke-dashoffset: 102; opacity: 1; } 24% { stroke-dashoffset: 0; } 84% { stroke-dashoffset: 0; opacity: 1; } 96%, 100% { stroke-dashoffset: 0; opacity: 0; } }
      @keyframes la-v { 0%, 20% { stroke-dashoffset: 178; opacity: 1; } 50% { stroke-dashoffset: 0; } 84% { stroke-dashoffset: 0; opacity: 1; } 96%, 100% { stroke-dashoffset: 0; opacity: 0; } }
      @keyframes la-rebond { 0%, 48% { transform: scale(1); } 55% { transform: scale(1.14) rotate(-3deg); } 63% { transform: scale(.96); } 70%, 84% { transform: scale(1); } 96%, 100% { transform: scale(.9); } }
      @keyframes la-onde { 0%, 49% { opacity: 0; transform: scale(.7); } 52% { opacity: .55; } 75%, 100% { opacity: 0; transform: scale(1.45); } }
    </style>
  </head>
  <body>
    <div id="root"><div class="lancement"><svg viewBox="0 0 200 200" width="110" aria-label="Croivez" style="overflow:visible"><defs><mask id="lm" maskUnits="userSpaceOnUse" x="0" y="0" width="200" height="200"><rect width="200" height="200" fill="#fff"/><path class="la-v" d="M44 106 L82 146 L158 50" fill="none" stroke="#000" stroke-width="44" stroke-linecap="round" stroke-linejoin="round"/></mask></defs><circle class="la-onde" cx="100" cy="100" r="70" fill="none" stroke="#6FC59F" stroke-width="4"/><g class="la-corps"><path class="la-x" d="M84 60 L156 132" mask="url(#lm)" fill="none" stroke="#E3574B" stroke-width="26" stroke-linecap="round"/><path class="la-v" d="M44 106 L82 146 L158 50" fill="none" stroke="#6FC59F" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/></g></svg></div></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
